<section class="modal-backdrop" (click)="fecharModal()"></section>

<!-- Card do modal -->
<section class="modal-card">
  <!-- Cabeçalho -->
  <header class="modal-header">
    <app-icones-svg class="modal-image" [class]="'icone-' + data.icone" [nome]="data.icone" />
  </header>

  <!-- Corpo -->
  <main class="modal-main">
    <h2>{{ data.titulo }}</h2>
    <span class="modal-mensagem"> {{ data.mensagem }} </span>
    <span class="modal-mensagem"> {{ data.dados }} </span>
  </main>

  <!-- Rodapé com botões -->
  <footer class="modal-footer">
    @if (data.botaoNegacao) {
      <button class="modal-btn btn-secondary" (click)="fecharModal()" [disabled]="carregando()">
        {{ data.botaoNegacao }}
      </button>
    }
    @if (data.botaoNeutro) {
      <button class="modal-btn btn-third" (click)="onNeutro()" [disabled]="carregando()">
        {{ data.botaoNeutro }}
      </button>
    }
    @if (data.botaoConfirmacao) {
      <button class="modal-btn btn-primary" (click)="onConfirmar()" [disabled]="carregando()">
        @if (carregando()) {
          <span class="spinner"></span> Processando...
        } @else {
          {{ data.botaoConfirmacao }}
        }
      </button>
    }
  </footer>
</section>
