<!-- Sobreposição do fundo -->
<section class="modal-backdrop" (click)="fecharModal()"></section>

<!-- Card do modal -->
<section class="modal-card">
  <!-- Cabeçalho -->
  <header class="modal-header">
    <app-icones-svg class="modal-image" [class]="'icone-' + data.icone" [nome]="data.icone" />
  </header>

  <!-- Corpo -->
  <main class="modal-main">
    <h2>{{ data.titulo }} {{ data.entidade | uppercase }}</h2>
    <span class="modal-mensagem"> {{ data.mensagem }} {{ data.entidade }} {{ data.dados }}? </span>
  </main>

  <!-- Rodapé com botões -->
  <footer class="modal-footer">
    <button class="modal-btn btn-secondary" (click)="fecharModal()" [disabled]="carregando()">
      Cancelar
    </button>
    <button class="modal-btn btn-primary" (click)="onConfirmar()" [disabled]="carregando()">
      @if (carregando()) {
        <span class="spinner"></span> Processando...
      } @else {
        Confirmar
      }
    </button>
  </footer>
</section>
