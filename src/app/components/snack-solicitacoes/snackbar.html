<div class="snackbar" role="status" aria-live="polite">
  <span class="snackbar-icone" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path
        d="M20 6 9 17l-5-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </span>

  <p class="snackbar-texto">{{ mensagem() }}</p>

  <button
    type="button"
    class="snackbar-fechar"
    (click)="fechar.emit()"
    aria-label="Fechar aviso"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M6 6l12 12M18 6L6 18"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
      />
    </svg>
  </button>
